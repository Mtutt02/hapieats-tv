name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Vercel is the authoritative build gate for production (it has the real env
# vars). A full `next build` can't run in CI without the project's
# Supabase/Stripe/Mux secrets, so we don't attempt it here — but the typecheck
# does run, and it blocks: the repo is expected to stay at zero type errors.
jobs:
  typecheck:
    name: Typecheck (visibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
